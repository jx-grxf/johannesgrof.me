<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og card</title>
    <!--
      The link-preview card, 1200x630. Open it directly in a browser to iterate,
      or render it with `npm run brand`. Append ?lang=de for the German card.

      Every value below is lifted from src/styles/global.css — if a token moves
      there, move it here too. The card shows the work instead of a slogan: the
      app icons from public/projects and a real ÖffiGo screen, same set as the
      LinkedIn banner (2026-10-27). __PUBLIC__ is swapped by render.mjs for the
      public/ folder, because the page is copied to a temp dir before Chrome
      opens it.
    -->
    <style>
      /* The token below is swapped by render.mjs for the Geist woff2 files
         inlined as data URIs, so the page makes no external request and renders
         the same whether it is opened from disk or driven by headless Chrome.
         Opened raw in a browser it falls back to the system stack, which is
         fine for checking layout but not for judging the type. */
      __FONTS__

      :root {
        --paper: #12110f;
        --ink: #f1eee5;
        --ink-2: #c6c0b2;
        --mute: #948d7e;
        --rule: #3b352c;
        --signal: #ff6a4d;
        /* The site runs this at 2.4%. At card scale it is quantised away by
           PNG encoding and the downscale every feed applies, so it is lifted
           just enough to survive. */
        --grid-line: rgb(241 238 229 / 4.5%);
        --grid-size: 28px;

        --font-display: "Geist Card", sans-serif;
        --font-mono: "Geist Mono Card", monospace;
        --label-track: 0.14em;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: var(--paper);
        background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: var(--grid-size) var(--grid-size);
        color: var(--ink);
        font-family: var(--font-display);
        font-variant-numeric: tabular-nums lining-nums;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .top {
        position: absolute;
        top: 64px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .top svg {
        width: 44px;
        height: 44px;
      }

      .eyebrow {
        margin: 0;
        color: var(--mute);
        font-family: var(--font-mono);
        font-size: 20px;
        letter-spacing: var(--label-track);
        text-transform: uppercase;
      }

      /* Matches .hero h1 in global.css. */
      .name {
        position: absolute;
        top: 160px;
        left: 72px;
        margin: 0;
        font-size: 92px;
        font-weight: 700;
        line-height: 0.94;
        letter-spacing: -0.045em;
      }

      .lede {
        position: absolute;
        top: 268px;
        left: 74px;
        width: 640px;
        margin: 0;
        color: var(--ink-2);
        font-size: 28px;
        line-height: 1.3;
      }

      .lede b {
        color: var(--ink);
        font-weight: 600;
      }

      .apps {
        position: absolute;
        top: 404px;
        left: 72px;
        display: flex;
        gap: 18px;
      }

      .app {
        width: 72px;
        text-align: center;
      }

      .app img {
        display: block;
        width: 64px;
        height: 64px;
        margin: 0 auto;
        border-radius: 15px;
        box-shadow: 0 0 0 1px rgb(241 238 229 / 10%);
      }

      .app span {
        display: block;
        margin-top: 10px;
        color: var(--mute);
        font-family: var(--font-mono);
        font-size: 12px;
        white-space: nowrap;
      }

      .app.lead span {
        color: var(--signal);
      }

      .foot {
        position: absolute;
        left: 72px;
        bottom: 56px;
        margin: 0;
        color: var(--ink-2);
        font-family: var(--font-mono);
        font-size: 22px;
        letter-spacing: 0.08em;
      }

      /* The same prompt that sits in front of the name in the site header. */
      .prompt {
        margin-right: 0.5em;
        color: var(--signal);
      }

      .phone {
        position: absolute;
        top: 70px;
        right: 64px;
        width: 290px;
        transform: rotate(-3deg);
        filter: drop-shadow(0 28px 50px rgb(0 0 0 / 60%));
      }
    </style>
  </head>
  <body>
    <div class="top">
      <svg viewBox="0 0 64 64" style="--mark: var(--signal)">__MARK__</svg>
      <p class="eyebrow" data-eyebrow></p>
    </div>
    <h1 class="name">Johannes Grof</h1>
    <p class="lede" data-lede></p>
    <div class="apps">
      <div class="app lead"><img src="__PUBLIC__/projects/oeffigo/icon.png" alt="" /><span>ÖffiGo</span></div>
      <div class="app"><img src="__PUBLIC__/projects/portpirate/app-icon.png" alt="" /><span>PortPirate</span></div>
      <div class="app"><img src="__PUBLIC__/projects/briskedit/logo.png" alt="" /><span>BriskEdit</span></div>
      <div class="app"><img src="__PUBLIC__/projects/dirhop/logo.png" alt="" /><span>dirhop</span></div>
      <div class="app"><img src="__PUBLIC__/projects/notchtray/logo.png" alt="" /><span>NotchTray</span></div>
      <div class="app"><img src="__PUBLIC__/projects/cswap/logo.png" alt="" /><span>CSwap</span></div>
      <div class="app"><img src="__PUBLIC__/projects/kontobuch/icon.svg" alt="" /><span>Kontobuch</span></div>
    </div>
    <p class="foot"><span class="prompt">$</span>johannesgrof.me</p>
    <img class="phone" src="__PUBLIC__/projects/oeffigo/departures-praterstern.webp" alt="" />

    <script>
      const COPY = {
        en: {
          eyebrow: "HTL Kaindorf · Styria, Austria",
          lede: "Apps for iPhone and Mac, tools for the terminal. Right now mostly <b>ÖffiGo</b>, the transit app for all of Austria.",
        },
        de: {
          eyebrow: "HTL Kaindorf · Südoststeiermark",
          lede: "Apps für iPhone und Mac, Werkzeuge fürs Terminal. Gerade vor allem <b>ÖffiGo</b>, die Öffi-App für ganz Österreich.",
        },
      };

      const lang = new URLSearchParams(location.search).get("lang") === "de" ? "de" : "en";
      const copy = COPY[lang];
      document.documentElement.lang = lang;
      document.querySelector("[data-eyebrow]").textContent = copy.eyebrow;
      document.querySelector("[data-lede]").innerHTML = copy.lede;
    </script>
  </body>
</html>
