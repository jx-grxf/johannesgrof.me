<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="jg">
  <!--
    jg, set in Geist Mono at wght 700 and converted to outlines — an SVG favicon
    cannot load a webfont, so <text> would fall back to whatever monospace face
    the browser happens to default to. Regenerate with tools/brand/glyphs.py;
    the pair is tracked in off the mono advance so it reads as one mark at 16px.

    Two paper stocks, same as the site: dark by default, light when the reader's
    system is. Square, no corner radius — the design system has none.
  -->
  <style>
    :root {
      --paper: #12110f;
      --mark: #ff6a4d;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --paper: #f4f2ed;
        /* The print red. #ff6a4d is the version lifted for dark paper only. */
        --mark: #cf3a20;
      }
    }
  </style>
  <rect width="64" height="64" fill="var(--paper)"/>
  <g fill="var(--mark)" transform="translate(3.58 45.48) scale(0.048327 -0.048327)">
    <path d="M98.00 -150.00V-42.40H248.00Q291.80 -42.40 312.50 -22.40Q333.20 -2.40 333.20 44.40V486.20L391.00 428.40H102.60V536.00H468.80V39.60Q468.80 -52.60 416.90 -101.30Q365.00 -150.00 261.60 -150.00ZM331.20 601.60V720.00H468.40V601.60Z"/>
