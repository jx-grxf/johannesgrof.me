name: Refresh deployment

# Rebuilds the site on a schedule so build-time GitHub data (releases,
# download counts, repo metadata) stays current without a manual push.
#
# Calls the deploy hook of whichever host serves the site:
#   CLOUDFLARE_DEPLOY_HOOK  Workers & Pages → johannesgrof-me → Settings → Builds → Deploy Hooks (branch main)
#   VERCEL_DEPLOY_HOOK      Vercel → Project → Settings → Git → Deploy Hooks (branch main)
# Both are repository secrets; the Cloudflare one wins when both are set.

on:
  schedule:
    # Every day at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  redeploy:
    name: Trigger rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy hook
        env:
          CLOUDFLARE_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          hook="${CLOUDFLARE_HOOK:-$VERCEL_HOOK}"
          if [ -z "$hook" ]; then
            echo "No deploy hook secret is set — skipping." >&2
            exit 0
          fi
          curl -fsSL -X POST "$hook"
